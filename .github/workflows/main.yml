name: Build Shree Kasthbhanjan APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check original HTML
        run: |
          if [ ! -f index.html ]; then
            echo "ERROR: index.html repository ke root mein nahi hai."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Capacitor project
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install --save-exact @capacitor/core@5.7.8 @capacitor/android@5.7.8
          npm install --save-dev --save-exact @capacitor/cli@5.7.8
          npx cap init "Shree Kasthbhanjan" com.kasthbhanjan.app --web-dir www

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shree-Kasthbhanjan-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
